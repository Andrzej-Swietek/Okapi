version = "3.11.5"

style = defaultWithAlign

align {
  stripMargin = true
  preset = none
}

assumeStandardLibraryStripMargin = false

binPack {
  literalArgumentLists = false
}

continuationIndent {
  defnSite = 2
  ctorSite = 2
  extendSite = 2
  withSiteRelativeToExtends = 2
}

includeNoParensInSelectChains = false

// lets scalafmt rejoin an already-broken select chain, such as the `.nn` chains of Java interop under -Yexplicit-nulls
optIn.breakChainOnFirstMethodDot = false

indent {
  caseSite = 5
}

indentOperator {
  topLevelOnly = false
}

maxColumn = 120

newlines {
  alwaysBeforeElseAfterCurlyIf = true
  avoidInResultType = true
  beforeCurlyLambdaParams = multilineWithCaseOnly
}

project {
  excludeFilters = [
    ".metals"
  ]
}

rewrite {
  imports = {
    sort = scalastyle
    contiguousGroups = only
    groups = [
      ["zio.*"]
      ["api.*", "domain.*", "implementation.*"]
      ["java.*"]
    ]
  }
  rules = [
    PreferCurlyFors
    RedundantParens
    SortModifiers
    Imports
  ]
  sortModifiers {
    order = [
      "override",
      "private",
      "protected",
      "implicit",
      "final",
      "sealed",
      "abstract",
      "lazy"
    ]
  }
}

rewriteTokens {
  "⇒" = "=>"
  "→" = "->"
  "←" = "<-"
}

runner {
  dialect = scala3
}

spaces {
  inImportCurlyBraces = true
}

trailingCommas = multiple

danglingParentheses.exclude = []

verticalMultiline {
  arityThreshold = 7
  atDefnSite = true
  newlineAfterOpenParen = true
}

fileOverride {
  "glob:**/sbt/src/**" {
    runner.dialect = scala212
  }
}
