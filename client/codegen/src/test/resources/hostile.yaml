openapi: 3.1.0
info:
  title: Hostile
  version: '1'
paths:
  /api/user-accounts/{user-id}/items:
    get:
      operationId: list-items
      tags: [User accounts]
      parameters:
      - name: user-id
        in: path
        required: true
        schema: { type: string }
      - name: type
        in: query
        required: false
        schema: { $ref: '#/components/schemas/Kind' }
      - name: kinds
        in: query
        required: false
        schema:
          type: array
          items: { $ref: '#/components/schemas/Kind' }
      - name: 2fa
        in: header
        required: false
        schema: { type: boolean }
      - name: X-Trace
        in: header
        required: true
        schema: { type: string, format: uuid }
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Request' }
    post:
      operationId: list-items
      tags: [User accounts]
      parameters:
      - name: user-id
        in: path
        required: true
        schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Uri' }
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: integer, format: int64 }
                  status:
                    type: string
                    enum: [ok, not ok, '', OK]
  /api/trees:
    put:
      operationId: class
      tags: [Trees]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Tree' }
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { $ref: '#/components/schemas/Tree' }
  /api/trees/{id}/$weird path/x:
    get:
      operationId: weird
      tags: [Trees]
      parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stream' }
  /api/shapes:
    post:
      operationId: draw
      tags: [Trees]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Shape' }
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema: { $ref: '#/components/schemas/List' }
  /api/shapes/origin:
    get:
      operationId: origin
      tags: [Trees]
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Point' }
  /api/pets:
    post:
      operationId: adopt
      tags: [Pets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pet' }
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
  /api/pets/card:
    get:
      operationId: card
      tags: [Pets]
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PetBase'
                - type: object
                  required: [score]
                  properties:
                    score: { type: integer }
  /api/pets/odd:
    get:
      operationId: odd
      tags: [Pets]
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Odd' }
  /api/entries:
    put:
      operationId: entries
      tags: [Entries]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Entry' }
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Folder' }
  /api/files/{name}.json:
    get:
      operationId: file
      tags: [Files]
      parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
      - name: X-Ids
        in: header
        required: true
        schema:
          type: array
          items: { type: string }
      - name: X-Tags
        in: header
        required: false
        schema:
          type: array
          items: { type: string }
      responses:
        '204':
          description: ''
  /api/models/{id}:predict:
    post:
      operationId: predict
      tags: [Files]
      parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
      responses:
        '204':
          description: ''
  /api/report.{format}/{a}{b}:
    get:
      operationId: report
      tags: [3d models]
      parameters:
      - name: format
        in: path
        required: true
        schema: { type: string }
      - name: a
        in: path
        required: true
        schema: { type: string }
      - name: b
        in: path
        required: true
        schema: { type: string }
      responses:
        '204':
          description: ''
  /api/collide:
    post:
      operationId: collide
      tags: [Files]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Collide' }
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collide' }
components:
  schemas:
    Kind:
      type: string
      enum: [a-b, '1st', type, A B]
    Request:
      type: object
      required: [class, 'x-y']
      properties:
        class: { type: string }
        'x-y': { type: integer }
        '3d': { type: boolean }
        header: { $ref: '#/components/schemas/Header' }
        when: { type: string, format: date-time }
    Header:
      type: object
      properties:
        name: { type: string }
    Uri:
      type: object
      required: [value]
      properties:
        value: { type: string }
    Stream:
      type: object
      properties:
        task: { $ref: '#/components/schemas/Task' }
    Task:
      type: object
      properties:
        done: { type: boolean }
    List:
      type: object
      properties:
        items:
          type: array
          items: { type: string }
    Tree:
      type: object
      required: [label]
      properties:
        label: { type: string }
        children:
          type: array
          items: { $ref: '#/components/schemas/Tree' }
    Shape:
      oneOf:
      - $ref: '#/components/schemas/Circle'
      - $ref: '#/components/schemas/Square'
      - $ref: '#/components/schemas/Point'
      discriminator:
        propertyName: kind
        mapping:
          circle: '#/components/schemas/Circle'
          square: '#/components/schemas/Square'
          point: '#/components/schemas/Point'
    Circle:
      type: object
      required: [kind, r]
      properties:
        kind: { type: string }
        r: { type: number }
    Square:
      type: object
      required: [kind]
      properties:
        kind: { type: string }
    Point:
      type: object
      properties:
        kind: { type: string }
    PetBase:
      type: object
      required: [petType, name]
      properties:
        petType: { type: string }
        name: { type: string }
    Dog:
      allOf:
      - $ref: '#/components/schemas/PetBase'
      - type: object
        required: [bark]
        properties:
          bark: { type: boolean }
    Cat:
      allOf:
      - $ref: '#/components/schemas/PetBase'
      - type: object
        properties:
          owner:
            allOf:
            - $ref: '#/components/schemas/Header'
    Pet:
      oneOf:
      - $ref: '#/components/schemas/Dog'
      - $ref: '#/components/schemas/Cat'
      discriminator:
        propertyName: petType
    Odd:
      oneOf:
      - $ref: '#/components/schemas/Kind'
      discriminator:
        propertyName: k
    Entry:
      oneOf:
      - $ref: '#/components/schemas/Folder'
      - $ref: '#/components/schemas/File'
      discriminator:
        propertyName: kind
    Folder:
      type: object
      required: [name]
      properties:
        name: { type: string }
        children:
          type: array
          items: { $ref: '#/components/schemas/Folder' }
    File:
      type: object
      required: [name]
      properties:
        name: { type: string }
    Collide:
      type: object
      required: [user_id, userId, labels]
      properties:
        user_id: { type: string }
        userId: { type: string }
        '@type': { type: string }
        type: { type: string }
        Name: { type: string }
        name: { type: string }
        labels:
          type: array
          items: { type: string }
